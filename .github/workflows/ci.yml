name: Local integrity and package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_project.py
      - run: python scripts/rehearse.py
      - run: python scripts/build_release.py --version 1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: ba-mate-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/1.0.0/
