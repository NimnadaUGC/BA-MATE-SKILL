<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BA Mate: from a business question to reviewed requirements</title>
  <desc id="desc">Enter with a new brief, an existing specification or a change. Iterate through evidence, questions, proposals and review. People verify meaning and approve selected revisions. Keep the baseline and review impacts when inputs change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526778"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#163447}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#4d6473}.label{font-size:17px;font-weight:700;letter-spacing:1px}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#4d6473}.line{fill:none;stroke:#526778;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="800" rx="24" fill="#f3f7fa"/>
  <rect width="1200" height="10" rx="5" fill="#087f8c"/>
  <text x="44" y="63" class="label" fill="#087f8c">BA MATE · YOUR WORKFLOW</text>
  <text x="44" y="112" class="title">Start with the business. Keep people in charge.</text>
  <text x="44" y="150" class="sub">Choose the entry point you need. Move back whenever new questions appear.</text>
  <rect x="44" y="185" width="354" height="68" rx="14" fill="#fff" stroke="#b4cbd7"/>
  <rect x="423" y="185" width="354" height="68" rx="14" fill="#fff" stroke="#b4cbd7"/>
  <rect x="802" y="185" width="354" height="68" rx="14" fill="#fff" stroke="#b4cbd7"/>
  <text x="221" y="227" text-anchor="middle" class="head">A new business brief</text>
  <text x="600" y="227" text-anchor="middle" class="head">An existing specification</text>
  <text x="979" y="227" text-anchor="middle" class="head">A proposed change</text>
  <path d="M221 253V282H979V253M600 253V307" class="line"/>
  <rect x="44" y="308" width="1112" height="248" rx="20" fill="#e6eff4"/>
  <text x="66" y="343" class="label">WORK TOGETHER · REPEAT AS NEEDED</text>
  <rect x="66" y="366" width="243" height="130" rx="14" fill="#fff"/>
  <rect x="341" y="366" width="243" height="130" rx="14" fill="#fff"/>
  <rect x="616" y="366" width="243" height="130" rx="14" fill="#fff"/>
  <rect x="891" y="366" width="243" height="130" rx="14" fill="#fff"/>
  <text x="85" y="402" class="head">Evidence</text>
  <text x="85" y="438" class="body">Read real passages.</text><text x="85" y="467" class="body">Show gaps and limits.</text>
  <text x="360" y="402" class="head">Clarify</text>
  <text x="360" y="438" class="body">Ask useful questions.</text><text x="360" y="467" class="body">Record actual answers.</text>
  <text x="635" y="402" class="head">Propose</text>
  <text x="635" y="438" class="body">Draft requirements.</text><text x="635" y="467" class="body">Explain the process.</text>
  <text x="910" y="402" class="head">Review</text>
  <text x="910" y="438" class="body">Check meaning.</text><text x="910" y="467" class="body">Select, edit or reject.</text>
  <path d="M310 430H337" class="line"/>
  <path d="M585 430H612" class="line"/>
  <path d="M860 430H887" class="line"/>
  <path d="M1012 500V529H187V501" class="line"/>
  <path d="M600 557V585" class="line"/>
  <rect x="44" y="587" width="1112" height="79" rx="15" fill="#087f8c"/>
  <text x="66" y="619" style="fill:#fff" class="head">Human approval of an exact selection</text>
  <text x="66" y="649" style="fill:#fff" class="body">Verify evidence support, resolve affected blockers, identify revisions and exclusions.</text>
  <path d="M600 666V689H298V710" class="line"/>
  <path d="M600 689H902V710" class="line"/>
  <rect x="44" y="712" width="508" height="58" rx="13" fill="#fff" stroke="#b4cbd7"/>
  <rect x="577" y="712" width="579" height="58" rx="13" fill="#fff" stroke="#b4cbd7"/>
  <text x="298" y="748" text-anchor="middle" class="body">Retain the baseline · export selected work</text>
  <text x="866" y="748" text-anchor="middle" class="body">Inputs change? Assess impacts and review new drafts.</text>
</svg>
